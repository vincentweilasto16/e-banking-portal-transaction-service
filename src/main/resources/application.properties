# app configuration
spring.application.name=transaction-service


# monitoring configuration
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,threaddump,httpexchanges
management.endpoint.health.show-details=always


# logging configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka.clients.consumer=INFO
logging.level.org.apache.kafka.clients.producer=INFO
logging.pattern.level=%5p [${spring.application.name:},%X{X-Correlation-Id}]


# database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/e_banking_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# kafka configuration
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=transaction-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


